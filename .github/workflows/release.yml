name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  pull-requests: write

# A release must never be cancelled mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the version check runs on its own, without needs, so a merge that forgot to
  # bump package.json fails in seconds instead of after the whole pipeline
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Fail if version is already released
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Bump package.json version in the PR to release." >&2
            exit 1
          fi

  # `ci` and `e2e` are reusable workflow calls; `timeout-minutes` is not a
  # supported keyword there. Their timeouts live in the called workflows
  # (ci.yml: 20, e2e.yml: 20 per shard).
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-publish:
    needs: [version-check, ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build project artifacts
        uses: ./.github/actions/build-dodecagon
        with:
          bump: none

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Get container image name
        id: get_image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          registry: ghcr.io
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ steps.get_image.outputs.name }}:latest
            ${{ steps.get_image.outputs.name }}:v${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Dodecagon
            org.opencontainers.image.description=Dodecagon Server
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # the tag is pushed before the release so the release attaches to an
      # annotated tag it did not have to create, and so publishing never leaves
      # an artifact-less tag behind on its own
      - name: Create and push Git tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          # a published release, not a draft: a merge is the only manual step
          make_latest: true
          generate_release_notes: true
          files: |
            apps/server/build/out/dodecagon-linux-x64
            apps/server/build/out/dodecagon-linux-arm64
            apps/server/build/out/dodecagon-windows-x64.exe
            apps/server/build/out/dodecagon-macos-arm64
            apps/server/build/out/release.json
          body: |
            ## Docker Image
            ```bash
            docker pull ${{ steps.get_image.outputs.name }}:v${{ steps.get_version.outputs.version }}
            ```
