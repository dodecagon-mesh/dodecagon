name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  pull-requests: write

# A release must never be cancelled mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the next patch is computed from the tags, so a merge is the only manual
  # step. a manual major/minor bump in package.json wins when it is ahead of
  # the tags; the commit itself is not rewritten and no push is needed here
  version:
    name: Next Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute the next version
        id: next
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          pkg="$(jq -r .version package.json)"

          if [ -n "$latest" ]; then
            tag="${latest#v}"

            # a manual major/minor bump is newer than the last release and must
            # not be reduced to a patch of the tag
            if [ "$pkg" != "$tag" ] && [ "$(printf '%s\n%s\n' "$pkg" "$tag" | sort -V | tail -n 1)" = "$pkg" ]; then
              version="$pkg"
            else
              version="$(printf '%s' "$tag" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')"
            fi
          else
            version="$(printf '%s' "$pkg" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')"
          fi

          case "$version" in
            *[!0-9.]*|.*|*.) echo "unexpected version '$version'" >&2; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (latest tag: ${latest:-none}, package: $pkg)"

  # `ci` and `e2e` are reusable workflow calls; `timeout-minutes` is not a
  # supported keyword there. Their timeouts live in the called workflows
  # (ci.yml: 20, e2e.yml: 20 per shard).
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-publish:
    needs: [version, ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # the build is versioned from the computed value; package.json is not
    # rewritten and the artifacts, tag, release and Docker image all agree
    env:
      DODECAGON_BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build project artifacts
        uses: ./.github/actions/build-dodecagon
        with:
          bump: none

      - name: Get new version
        id: get_version
        run: echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Get container image name
        id: get_image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          registry: ghcr.io
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ steps.get_image.outputs.name }}:latest
            ${{ steps.get_image.outputs.name }}:v${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Dodecagon
            org.opencontainers.image.description=Dodecagon Server
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # the tag is pushed before the release so the release attaches to an
      # annotated tag it did not have to create, and so publishing never leaves
      # an artifact-less tag behind on its own
      - name: Create and push Git tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          # a published release, not a draft: a merge is the only manual step
          make_latest: true
          generate_release_notes: true
          files: |
            apps/server/build/out/dodecagon-linux-x64
            apps/server/build/out/dodecagon-linux-arm64
            apps/server/build/out/dodecagon-windows-x64.exe
            apps/server/build/out/dodecagon-macos-arm64
            apps/server/build/out/release.json
          body: |
            ## Docker Image
            ```bash
            docker pull ${{ steps.get_image.outputs.name }}:v${{ steps.get_version.outputs.version }}
            ```

      # action-gh-release warns and carries on when GitHub rejects one upload.
      # v0.0.83 lost its linux-arm64 binary that way and the job stayed green,
      # so the release counts as done only when every expected file is attached
      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          expected="dodecagon-linux-x64 dodecagon-linux-arm64 dodecagon-windows-x64.exe dodecagon-macos-arm64 release.json"

          for attempt in 1 2 3; do
            attached="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            missing=""

            for name in $expected; do
              if ! printf '%s\n' "$attached" | grep -qx "$name"; then
                missing="$missing apps/server/build/out/$name"
              fi
            done

            if [ -z "$missing" ]; then
              echo "release $TAG carries every expected asset"
              exit 0
            fi

            echo "attempt $attempt is uploading:$missing"
            # shellcheck disable=SC2086
            gh release upload "$TAG" $missing --clobber || echo "upload attempt $attempt failed"
          done

          echo "release $TAG is missing:$missing after three attempts" >&2
          exit 1
