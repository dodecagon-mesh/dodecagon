name: Publish Development Image

on:
  workflow_dispatch:

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build project artifacts
        uses: ./.github/actions/build-dodecagon

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          tags: ${{ secrets.DOCKER_USERNAME }}/dodecagon:dev
          labels: |
            org.opencontainers.image.title=Dodecagon
            org.opencontainers.image.description=Dodecagon Server (dev)
            org.opencontainers.image.source=https://github.com/dodecagon-mesh/dodecagon
            org.opencontainers.image.revision=${{ github.sha }}
