name: E2E Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Literal prefix instead of ${{ github.workflow }}: a called workflow resolves
# github.workflow to the caller's name, which would make CI and E2E share a
# group (and cancel each other) when release.yml calls both.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/e2e/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: bunx playwright install

      - name: Run E2E tests
        working-directory: packages/e2e
        run: bun run seed:e2e && bunx playwright test --shard=${{ matrix.shard }}/4

  # the shards already decide the workflow result; this job gives the matrix one summary
  # name in the pull request checks list. master's merge gate is the signoff ruleset, not
  # this check.
  complete:
    name: Run E2E Tests
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a shard failed
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "e2e shards reported: ${{ needs.ci.result }}" >&2
            exit 1
          fi
