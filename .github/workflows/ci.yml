name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Literal prefix instead of ${{ github.workflow }}: a called workflow resolves
# github.workflow to the caller's name, which would make CI and E2E share a
# group (and cancel each other) when release.yml calls both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

      # fails when a locale is missing a key that the english locale has
      - name: Check translations
        working-directory: packages/scripts
        run: bun run synci18n

      - name: Run tests
        run: bun run test

      - name: Build
        working-directory: apps/server
        run: bun run build

      # the start server travels inside the binary and is imported from the data
      # directory, so the built bundle has to work on its own
      - name: Check the start server bundle
        working-directory: apps/server
        run: bun run test:bundle
