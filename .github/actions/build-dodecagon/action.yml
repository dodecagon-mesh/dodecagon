name: Build Dodecagon
description: Install Bun dependencies and build server artifacts. Requires checkout before use.

inputs:
  bun_version:
    description: Bun version to install
    required: false
    default: 1.4.4
  bump:
    description: Version bump mode (none, patch, minor, major)
    required: false
    default: none
  sentry_client_dsn:
    description: DSN of the client error project, baked into the browser bundle
    required: false
    default: ''
  sentry_environment:
    description: Environment label of the baked browser bundle and the server
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun_version }}

    - name: Install dependencies
      shell: bash
      run: bun install

    - name: Build app
      shell: bash
      env:
        SENTRY_CLIENT_DSN: ${{ inputs.sentry_client_dsn }}
        SENTRY_ENVIRONMENT: ${{ inputs.sentry_environment }}
      run: |
        cd apps/server
        bun run build --bump "${{ inputs.bump }}"
